<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOMEBASE COLLECTIVE">
<meta name="theme-color" content="#0c0c0c">
<title>HOMEBASE COLLECTIVE</title>
<link rel="stylesheet" href="dinish.css">
<link rel="stylesheet" href="hbc-fonts.css">
<style>
:root{--bg:#0c0c0c;--panel:#141414f5;--fg:#e4e4e4;--muted:#959595;--line:#ffffff24;--soft:#ffffff0b;--taupe:#b4a99d;--ink:#312e2b;color-scheme:dark}
body.day{--bg:#f2f2f2;--panel:#fffffff5;--fg:#1a1a1a;--muted:#6d6d6d;--line:#00000022;--soft:#00000008;--ink:#312e2b;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:DINish,Montserrat,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--fg);background:var(--bg);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* intro */
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,#262626,#121212 35%,#000);transition:opacity 1.1s;cursor:pointer}
body.day #intro{background:linear-gradient(#d9d9d9,#ededed 35%,#fff)}
#intro .rule{width:1px;height:44px;background:var(--taupe);margin-bottom:26px;animation:appear 1.2s both}
#intro h1{font-family:'Noto Serif Display',Newsreader,serif;font-weight:400;font-size:42px;letter-spacing:-.02em;line-height:1.15;margin:0;color:#f0ede8;animation:appear 1.5s both;text-align:center}
body.day #intro h1{color:var(--ink)}
#intro .collective{font-family:Montserrat,sans-serif;font-size:10px;letter-spacing:.58em;text-indent:.58em;color:var(--taupe);margin-top:16px;animation:appear 1.8s both;text-align:center}
.wordref{transform:scaleY(-1);opacity:.14;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 62%);mask-image:linear-gradient(180deg,#000 0,transparent 62%);margin-top:2px;pointer-events:none}
.wordref h1{animation:none}
@keyframes appear{from{opacity:0}to{opacity:1}}
#intro.gone{opacity:0;pointer-events:none}

/* header */
header{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 19px) 26px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(var(--bg) 65%,transparent);pointer-events:none;opacity:0;transition:opacity .9s}
body.ready header{opacity:1}
header .brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
header .brand .vr{width:1px;height:15px;background:var(--taupe)}
header .word{font-family:'Noto Serif Display',Newsreader,serif;font-size:14px;letter-spacing:.02em;color:var(--fg)}
header .word em{font-family:Montserrat,sans-serif;font-style:normal;font-size:8px;letter-spacing:.34em;color:var(--taupe);vertical-align:1px;margin-left:7px}

main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 90px) 26px 60px;opacity:0;transition:opacity .9s}
body.ready main{opacity:1}
</style>
</head>
<body>

<div id="intro" aria-label="Homebase Collective intro">
  <div class="rule" aria-hidden="true"></div>
  <div>
    <h1>HOMEBASE</h1>
    <div class="collective">COLLECTIVE</div>
    <div class="wordref" aria-hidden="true">
      <h1>HOMEBASE</h1>
    </div>
  </div>
</div>

<header>
  <div class="brand">
    <span class="vr" aria-hidden="true"></span>
    <span class="word">Homebase<em>COLLECTIVE</em></span>
  </div>
</header>

<main></main>

<script>
const intro=document.getElementById('intro');
let entered=false;
function enter(){
  if(entered)return;entered=true;
  intro.classList.add('gone');
  document.body.classList.add('ready');
  setTimeout(()=>intro.remove(),1300);
}
intro.addEventListener('click',enter);
setTimeout(enter,2400);
</script>
</body>
</html>
