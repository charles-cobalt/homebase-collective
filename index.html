<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Home Base Collective</title>
<meta name="description" content="The Home Base Collective">
<meta name="theme-color" content="#e3e0db">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23312e2b'/%3E%3Ctext x='50' y='63' font-family='Georgia,serif' font-size='34' fill='%23e3e0db' text-anchor='middle'%3EH%7CB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="hbc-fonts.css">
<style>
:root{
  --morel:#6f6359;
  --dune:#b5aa9e;
  --coffee:#221913;
  --steam:#b4b2af;
  --diesel:#312e2b;
  --ghosted:#e3e0db;
  --white:#ffffff;
  --orchestra:#2d1b18;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(130% 95% at 50% 26%, #fbfaf7 0%, var(--ghosted) 58%, #d8d3cc 100%);
  font-family:'Mulish',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  color:var(--diesel);
  overflow:hidden;
}
.stage{
  padding:48px 24px;
  text-align:center;
}
.mark{
  width:min(66vw,300px);
  margin:0 auto;
  animation:rise 1.5s cubic-bezier(.22,.75,.25,1) backwards .15s;
}
.mark svg{display:block;width:100%;height:auto}
.arc{
  font-family:'Noto Serif Display',serif;
  font-weight:500;
  font-size:14px;
  letter-spacing:.24em;
  fill:var(--morel);
}
.arc-b{letter-spacing:.52em}
.mono{
  font-family:'Noto Serif Display',serif;
  font-weight:500;
  font-size:46px;
  letter-spacing:0;
  fill:var(--morel);
}
.rule{stroke:var(--morel);stroke-width:1.1}
.stage{position:relative;top:-6vh}
.reflection{
  position:absolute;
  top:calc(100% + 10px);
  left:50%;
  width:min(66vw,300px);
  transform:translateX(-50%) scaleY(-1);
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.24), rgba(0,0,0,0) 52%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.24), rgba(0,0,0,0) 52%);
  pointer-events:none;
  animation:rise 1.5s cubic-bezier(.22,.75,.25,1) backwards .3s;
}
@keyframes rise{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes rise-reflect{
  from{opacity:0;transform:translateX(-50%) scaleY(-1) translateY(16px)}
  to{opacity:1;transform:translateX(-50%) scaleY(-1) translateY(0)}
}
.reflection{animation-name:rise-reflect}
@media (prefers-reduced-motion: reduce){
  .mark,.reflection{animation:none}
}
</style>
</head>
<body>
<main class="stage">
  <div class="mark" role="img" aria-label="The Home Base Collective">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
      <defs>
        <path id="hb-top" d="M 36.5,100 A 63.5,63.5 0 0 1 163.5,100" fill="none"/>
        <path id="hb-bot" d="M 29.3,100 A 70.7,70.7 0 0 0 170.7,100" fill="none"/>
      </defs>
      <text class="arc"><textPath href="#hb-top" startOffset="50%" text-anchor="middle">THE HOME BASE</textPath></text>
      <text class="arc arc-b"><textPath href="#hb-bot" startOffset="50%" text-anchor="middle">COLLECTIVE</textPath></text>
      <text class="mono" x="72.5" y="116" text-anchor="middle">H</text>
      <line class="rule" x1="100" y1="63.5" x2="100" y2="136.5"/>
      <text class="mono" x="127.5" y="116" text-anchor="middle">B</text>
    </svg>
  </div>
  <div class="reflection" aria-hidden="true">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
      <defs>
        <path id="hb-top-r" d="M 36.5,100 A 63.5,63.5 0 0 1 163.5,100" fill="none"/>
        <path id="hb-bot-r" d="M 29.3,100 A 70.7,70.7 0 0 0 170.7,100" fill="none"/>
      </defs>
      <text class="arc"><textPath href="#hb-top-r" startOffset="50%" text-anchor="middle">THE HOME BASE</textPath></text>
      <text class="arc arc-b"><textPath href="#hb-bot-r" startOffset="50%" text-anchor="middle">COLLECTIVE</textPath></text>
      <text class="mono" x="72.5" y="116" text-anchor="middle">H</text>
      <line class="rule" x1="100" y1="63.5" x2="100" y2="136.5"/>
      <text class="mono" x="127.5" y="116" text-anchor="middle">B</text>
    </svg>
  </div>
</main>
</body>
</html>
