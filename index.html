:root{--bg:#0c0c0c;--panel:#141414f5;--fg:#e4e4e4;--muted:#959595;--line:#ffffff24;--soft:#ffffff0b;color-scheme:dark}
body.day{--bg:#f2f2f2;--panel:#fffffff5;--fg:#1a1a1a;--muted:#6d6d6d;--line:#00000022;--soft:#00000008;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:DINish,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--fg);background:var(--bg);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* intro */
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,#262626,#121212 35%,#000);transition:opacity 1.1s;cursor:pointer}
body.day #intro{background:linear-gradient(#d9d9d9,#ededed 35%,#fff)}
#intro .mark{width:56px;height:60px;animation:appear 1.4s both}
#intro .mark path{fill:#e4e4e4}
body.day #intro .mark path{fill:#1a1a1a}
.reflection{transform:scaleY(-1);margin-top:2px;opacity:.14;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 70%);mask-image:linear-gradient(180deg,#000 0,transparent 70%)}
#intro .reflect-wrap{animation:appear 1.4s both}
#intro h1{font-family:Telegrafico,DINish,sans-serif;font-weight:400;font-size:34px;letter-spacing:.06em;line-height:1.22;margin:22px 0 0;color:#e4e4e4;animation:appear 1.6s both;text-align:center}
body.day #intro h1{color:#1a1a1a}
#intro h1 span{display:block}
.wordref{transform:scaleY(-1);margin-top:1px;opacity:.14;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 65%);mask-image:linear-gradient(180deg,#000 0,transparent 65%)}
@keyframes appear{from{opacity:0}to{opacity:1}}
#intro.gone{opacity:0;pointer-events:none}

/* header */
header{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 19px) 26px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(var(--bg) 65%,transparent);pointer-events:none;opacity:0;transition:opacity .9s}
body.ready header{opacity:1}
header .brand{display:flex;align-items:center;gap:9px;pointer-events:auto}
header .brand svg{width:15px;height:16px;display:block}
header .brand svg path{fill:var(--fg)}
header .word{font-family:Telegrafico,DINish,sans-serif;font-size:12px;letter-spacing:.08em;color:var(--fg)}

main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 90px) 26px 60px;opacity:0;transition:opacity .9s}
body.ready main{opacity:1}
</style>
</head>
<body>

<div id="intro" aria-label="Homebase Collective intro">
  <svg class="mark" viewBox="0 0 64 68" aria-hidden="true"><path d="M14 4 H50 V30 L32 64 L14 30 Z"/></svg>
  <div class="reflect-wrap" aria-hidden="true">
    <svg class="mark reflection" viewBox="0 0 64 68"><path d="M14 4 H50 V30 L32 64 L14 30 Z"/></svg>
  </div>
  <h1>HOMEBASE<span>COLLECTIVE</span></h1>
  <h1 class="wordref" aria-hidden="true">HOMEBASE<span>COLLECTIVE</span></h1>
</div>

<header>
  <div class="brand">
    <svg viewBox="0 0 64 68" aria-hidden="true"><path d="M14 4 H50 V30 L32 64 L14 30 Z"/></svg>
    <span class="word">HOMEBASE <em>COLLECTIVE</em></span>
  </div>
</header>

<main></main>

<script>
const intro=document.getElementById('intro');
let entered=false;
function enter(){
  if(entered)return;entered=true;
  intro.classList.add('gone');
  document.body.classList.add('ready');
  setTimeout(()=>intro.remove(),1300);
}
intro.addEventListener('click',enter);
setTimeout(enter,2400);
</script>
</body>
</html>
