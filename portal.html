<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal - The Home Base</title>
<meta name="theme-color" content="#e3e0db">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23312e2b'/%3E%3Ctext x='50' y='63' font-family='Georgia,serif' font-size='34' fill='%23e3e0db' text-anchor='middle'%3EH%7CB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="hbc-fonts.css">
<style>
:root{
  --morel:#6f6359; --dune:#b5aa9e; --coffee:#221913; --steam:#b4b2af;
  --diesel:#312e2b; --ghosted:#e3e0db; --white:#ffffff; --orchestra:#2d1b18;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100dvh;
  background:radial-gradient(130% 95% at 50% 20%, #fbfaf7 0%, var(--ghosted) 60%, #dcd7d0 100%);
  font-family:'Mulish',system-ui,sans-serif;
  color:var(--diesel);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,.serif{font-family:'Noto Serif Display',serif;font-weight:500;letter-spacing:.01em}
.caps{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--morel)}
button{font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:12px;
  background:none;border:1px solid var(--morel);color:var(--diesel);padding:12px 22px;border-radius:0;cursor:pointer;
  transition:background .25s,color .25s}
button:hover{background:var(--diesel);color:var(--ghosted)}
button.solid{background:var(--diesel);color:var(--ghosted)}
button.solid:hover{background:var(--coffee)}
button.ghost{border-color:transparent;color:var(--morel);padding:8px 10px}
button.ghost:hover{background:none;color:var(--coffee)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{
  width:100%;font-family:'Mulish',sans-serif;font-size:15px;color:var(--diesel);
  background:rgba(255,255,255,.72);border:1px solid var(--dune);border-radius:0;padding:12px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--morel)}
label{display:block;margin:0 0 6px;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:10px;color:var(--morel)}
.field{margin-bottom:16px}
.hidden{display:none!important}

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid rgba(111,99,89,.25)}
header .brand{display:flex;align-items:center;gap:12px}
header svg{width:44px;height:44px;display:block}
header .wordmark{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.3em;color:var(--morel)}
main{max-width:880px;margin:0 auto;padding:34px 22px 90px}

/* auth */
.auth{max-width:400px;margin:8vh auto 0}
.auth h1{font-size:30px;margin:10px 0 26px}
.auth .swap{margin-top:18px;text-align:center}
.err{color:#8a3b2e;font-size:13px;margin:6px 0 14px;min-height:18px}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid rgba(111,99,89,.3);margin:26px 0 22px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;padding:12px 18px;color:var(--morel)}
.tabs button.on{border-bottom-color:var(--diesel);color:var(--diesel)}
.tabs button:hover{background:none;color:var(--coffee)}

/* chat */
.chatlog{display:flex;flex-direction:column;gap:14px;padding:6px 0 20px;min-height:120px}
.msg{max-width:78%;padding:12px 16px;font-size:15px;line-height:1.55}
.msg .who{font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--morel);margin-bottom:5px}
.msg.mine{align-self:flex-end;background:rgba(49,46,43,.92);color:var(--ghosted)}
.msg.mine .who{color:var(--steam)}
.msg.theirs{align-self:flex-start;background:rgba(255,255,255,.8);border:1px solid rgba(181,170,158,.5)}
.chatbox{display:flex;gap:10px;margin-top:8px}
.chatbox input{flex:1}
.msg .filechip{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 12px;border:1px solid rgba(181,170,158,.55);font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.05em}
.msg.mine .filechip{border-color:rgba(255,255,255,.35)}
.msg .filechip button{padding:2px 8px;font-size:10px}
.teamline{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.teamchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(181,170,158,.5);font-size:13px;background:rgba(255,255,255,.55)}
.teamchip button{border:none;background:none;padding:0;color:var(--morel);cursor:pointer;font-size:14px;line-height:1}
.matkind{font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:.18em;color:var(--morel)}
.empty{color:var(--morel);font-size:14px;padding:26px 0;text-align:center;font-style:italic;font-family:'Noto Serif Display',serif}

/* lists */
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 4px;border-bottom:1px solid rgba(111,99,89,.2)}
.row .t{font-size:16px}
.row .s{font-size:12.5px;color:var(--morel);margin-top:3px}
.row .acts{display:flex;gap:8px;flex-shrink:0}

/* presentation viewer */
.stage-view{position:fixed;inset:0;background:radial-gradient(130% 95% at 50% 20%, #fbfaf7 0%, var(--ghosted) 60%, #d8d3cc 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;z-index:50;text-align:center}
.stage-view .kicker{margin-bottom:26px}
.stage-view h1{font-size:clamp(30px,7vw,52px);font-weight:500;line-height:1.15;max-width:820px}
.stage-view p.body{margin-top:26px;font-size:clamp(16px,2.6vw,20px);line-height:1.7;color:var(--morel);max-width:640px;font-family:'Noto Serif Display',serif;font-style:italic}
.stage-view .count{position:absolute;bottom:26px;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.3em;color:var(--morel)}
.stage-view .leave{position:absolute;top:20px;right:22px}
.stage-view{overflow:auto}
.stagevideo{position:absolute;left:0;right:0;bottom:46px;padding:0 18px;text-align:center}
.stagevideo iframe, .vbox iframe{width:100%;max-width:640px;aspect-ratio:16/10;border:1px solid rgba(111,99,89,.35);background:#141210;display:block;margin:10px auto 0}
.slideedit{border:1px solid rgba(111,99,89,.3);padding:16px;margin-bottom:12px;background:rgba(255,255,255,.5)}
.presentbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.note{font-size:12.5px;color:var(--morel);line-height:1.6}
.spin{padding:60px 0;text-align:center;color:var(--morel);font-family:'Noto Serif Display',serif;font-style:italic;font-size:17px}
.appfoot{text-align:center;padding:44px 20px 34px;border-top:1px solid rgba(111,99,89,.18);margin-top:64px}
.appfoot-name{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--morel)}
.appfoot-by{font-family:'Noto Serif Display',serif;font-style:italic;font-size:14px;color:var(--morel);margin-top:9px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" aria-label="The Home Base Collective">
      <defs>
        <path id="ph-top" d="M 36.5,100 A 63.5,63.5 0 0 1 163.5,100" fill="none"/>
        <path id="ph-bot" d="M 29.3,100 A 70.7,70.7 0 0 0 170.7,100" fill="none"/>
      </defs>
      <text style="font-family:'Noto Serif Display',serif;font-weight:500;font-size:14px;letter-spacing:.24em;fill:#6f6359"><textPath href="#ph-top" startOffset="50%" text-anchor="middle">THE HOME BASE</textPath></text>
      <text style="font-family:'Noto Serif Display',serif;font-weight:500;font-size:14px;letter-spacing:.52em;fill:#6f6359"><textPath href="#ph-bot" startOffset="50%" text-anchor="middle">COLLECTIVE</textPath></text>
      <text x="72.5" y="116" text-anchor="middle" style="font-family:'Noto Serif Display',serif;font-weight:500;font-size:46px;fill:#6f6359">H</text>
      <line x1="100" y1="63.5" x2="100" y2="136.5" stroke="#6f6359" stroke-width="1.1"/>
      <text x="127.5" y="116" text-anchor="middle" style="font-family:'Noto Serif Display',serif;font-weight:500;font-size:46px;fill:#6f6359">B</text>
    </svg>
    <div class="wordmark">THE HOME BASE</div>
  </div>
  <div>
    <span id="who" class="caps" style="margin-right:12px"></span>
    <button id="signout" class="ghost hidden">Sign out</button>
  </div>
</header>

<main>
  <!-- AUTH -->
  <section id="auth" class="auth hidden">
    <p class="caps">Member portal</p>
    <div class="tabs" id="loginTabs" style="margin:0 0 20px">
      <button data-login="client" class="on">Client</button>
      <button data-login="studio">Studio</button>
    </div>
    <h1 id="authTitle">Welcome home</h1>
    <div id="nameField" class="field hidden">
      <label for="name">Full name</label>
      <input id="name" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password">
    </div>
    <div class="err" id="authErr"></div>
    <button id="authGo" class="solid" style="width:100%">Sign in</button>
    <div class="swap">
      <button id="authSwap" class="ghost">New here? Create your profile</button>
    </div>
  </section>

  <!-- CLIENT -->
  <section id="client" class="hidden">
    <p class="caps">Your case</p>
    <h1 id="clientTitle" style="font-size:28px;margin:8px 0 6px"></h1>
    <p class="note" id="clientSub"></p>
    <div id="clientCasePicker" class="hidden" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px"></div>
    <div class="tabs" id="clientTabs">
      <button data-tab="reflection" class="on">Reflection</button>
      <button data-tab="materials">Materials</button>
    </div>
    <div id="ctab-reflection"></div>
    <div id="ctab-materials" class="hidden"></div>
  </section>

  <!-- ADMIN -->
  <section id="admin" class="hidden">
    <p class="caps">Admin</p>
    <h1 style="font-size:28px;margin:8px 0 6px">Cases</h1>
    <div class="tabs" id="adminTabs">
      <button data-tab="cases" class="on">Cases</button>
      <button data-tab="case" class="hidden" id="adminCaseTab">Case</button>
    </div>
    <div id="atab-cases"></div>
    <div id="atab-case" class="hidden"></div>
  </section>
</main>

<footer class="appfoot">
  <div class="appfoot-name">The Home Base App &middot; &copy; <span id="footYear"></span></div>
  <div class="appfoot-by">by The Home Base Collective</div>
</footer>

<!-- LIVE PRESENTATION VIEWER -->
<div id="stageView" class="stage-view hidden">
  <button class="ghost leave" id="leaveStage">Leave</button>
  <p class="caps kicker" id="svKicker"></p>
  <h1 id="svTitle"></h1>
  <p class="body" id="svBody"></p>
  <div id="svMedia" style="margin:14px auto 0;max-width:640px"></div>
  <div class="count" id="svCount"></div>
  <div class="stagevideo">
    <button class="ghost" id="svVideoBtn">Join meeting room</button>
    <button class="ghost" id="svAudioBtn">Join audio only</button>
    <div id="svVideoBox" class="hidden"><iframe id="svVideoFrame" title="Meeting room" allow="camera; microphone; autoplay; clipboard-write; display-capture; fullscreen"></iframe></div>
  </div>
</div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, query, where, orderBy, limit as limitFs, onSnapshot, getDocs, serverTimestamp, updateDoc }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');

let me = null, myProfile = null, myCase = null, unsub = [];
$('footYear').textContent = new Date().getFullYear();

/* ---------- auth ---------- */
let loginAs = 'client';
$('loginTabs').onclick = e => {
  if (!e.target.dataset.login) return;
  loginAs = e.target.dataset.login;
  document.querySelectorAll('#loginTabs button').forEach(b => b.classList.toggle('on', b===e.target));
  signupMode = false;
  $('nameField').classList.add('hidden');
  $('authErr').textContent = '';
  if (loginAs === 'studio') {
    $('authTitle').textContent = 'Studio sign in';
    $('authGo').textContent = 'Sign in';
    $('authSwap').classList.add('hidden');
  } else {
    $('authTitle').textContent = 'Welcome home';
    $('authGo').textContent = 'Sign in';
    $('authSwap').classList.remove('hidden');
    $('authSwap').textContent = 'New here? Create your profile';
  }
};
let signupMode = false;
$('authSwap').onclick = () => {
  signupMode = !signupMode;
  $('authTitle').textContent = signupMode ? 'Create your profile' : 'Welcome home';
  $('authGo').textContent = signupMode ? 'Create profile' : 'Sign in';
  $('authSwap').textContent = signupMode ? 'Already a member? Sign in' : 'New here? Create your profile';
  $('nameField').classList.toggle('hidden', !signupMode);
  $('authErr').textContent = '';
};
$('authGo').onclick = async () => {
  $('authErr').textContent = '';
  const email = $('email').value.trim(), pass = $('pass').value, name = $('name').value.trim();
  try {
    if (signupMode) {
      if (!name) { $('authErr').textContent = 'Your name, please.'; return; }
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, role: 'client', createdAt: serverTimestamp()
      });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    $('authErr').textContent = ({'auth/invalid-credential':'Email or password not recognized.','auth/email-already-in-use':'That email already has a profile - sign in instead.','auth/weak-password':'Password needs at least 6 characters.','auth/invalid-email':'That email address is not valid.'})[e.code] || 'Something went wrong. Try again.';
  }
};
$('signout').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  unsub.forEach(u => u()); unsub = [];
  me = user;
  ['auth','client','admin'].forEach(hide);
  if (!user) { show('auth'); $('who').textContent=''; hide('signout'); return; }
  myProfile = (await getDoc(doc(db, 'users', user.uid))).data() || { name: user.email, role: 'client' };
  $('who').textContent = myProfile.name;
  show('signout');
  if (myProfile.role === 'admin') startAdmin(); else startClient();
});

/* ---------- chat (shared) ---------- */
function renderChat(el, caseId, phase, canPost) {
  el.innerHTML = `<div class="chatlog" id="log-${phase}"><div class="spin">Listening...</div></div>
    ${canPost ? `<div class="chatbox"><input id="in-${phase}" placeholder="Write a note..." autocomplete="off"><button class="ghost" id="att-${phase}" title="Send a photo or document">Attach</button><button class="solid" id="send-${phase}">Send</button></div>
    <input type="file" id="attfile-${phase}" class="hidden"><div class="note" id="attnote-${phase}"></div>` : ''}`;
  const log = $(`log-${phase}`);
  unsub.push(onSnapshot(
    query(collection(db, 'cases', caseId, 'messages'), where('phase','==',phase), orderBy('createdAt','asc')),
    snap => {
      if (window.__activeCase && window.__activeCase !== caseId) return;
      if (snap.empty) { log.innerHTML = `<div class="empty">${phase==='reflection' ? 'The reflection room is quiet for now.' : 'Nothing here yet.'}</div>`; return; }
      log.innerHTML = snap.docs.map(d => {
        const m = d.data();
        const chip = m.hasAttachment ? `<div class="filechip"><span>${esc(m.attachment.name)} · ${(m.attachment.size/1024).toFixed(0)} KB</span>
          ${(m.attachment.type||'').startsWith('image/') ? `<button class="ghost" data-cview="${d.id}">View</button>` : ''}
          <button class="ghost" data-cdl="${d.id}">Download</button></div>` : '';
        const when = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate().toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '';
        return `<div class="msg ${m.senderId===me.uid?'mine':'theirs'}"><div class="who">${esc(m.senderName||'')}${when ? ' · ' + when : ''}</div>${m.body ? esc(m.body) : ''}${chip}</div>`;
      }).join('');
      log.querySelectorAll('[data-cview]').forEach(b => b.onclick = () => viewChatFile(caseId, b.dataset.cview));
      log.querySelectorAll('[data-cdl]').forEach(b => b.onclick = () => downloadChatFile(caseId, b.dataset.cdl));
      log.scrollTop = log.scrollHeight;
    }));
  if (canPost) {
    const send = async () => {
      const inp = $(`in-${phase}`); const body = inp.value.trim(); if (!body) return;
      inp.value = '';
      await addDoc(collection(db, 'cases', caseId, 'messages'), {
        phase, body, senderId: me.uid, senderName: myProfile.name, createdAt: serverTimestamp()
      });
    };
    $(`send-${phase}`).onclick = send;
    $(`in-${phase}`).addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    $(`att-${phase}`).onclick = () => $(`attfile-${phase}`).click();
    $(`attfile-${phase}`).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      const note = $(`attnote-${phase}`);
      if (f.size > 8*1024*1024) { note.textContent = 'Keep files under 8 MB for now.'; return; }
      note.textContent = `Reading ${f.name}...`;
      try {
        const bytes = new Uint8Array(await f.arrayBuffer());
        let bin = '';
        for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
        const b64 = btoa(bin);
        note.textContent = `Posting ${f.name}...`;
        const msgRef = await addDoc(collection(db, 'cases', caseId, 'messages'), {
          phase, body: '', senderId: me.uid, senderName: myProfile.name,
          hasAttachment: true, attachment: { name: f.name, type: f.type || 'application/octet-stream', size: f.size },
          createdAt: serverTimestamp()
        });
        note.textContent = `Storing ${f.name}...`;
        await writeChunks(collection(db, 'cases', caseId, 'messages', msgRef.id, 'chunks'), b64);
        note.textContent = '';
      } catch (err) { note.textContent = 'That did not send. Try again.'; }
      e.target.value = '';
    };
  }
}

/* ---------- shared chunked-file helpers (Firestore, ~8MB cap) ---------- */
async function writeChunks(colRef, b64) {
  const CH = 700000;
  const parts = [];
  for (let i = 0; i < b64.length; i += CH) parts.push(b64.slice(i, i+CH));
  for (let i = 0; i < parts.length; i++)
    await setDoc(doc(colRef, String(i).padStart(4,'0')), { i, data: parts[i] });
  return parts.length;
}
async function assembleUrl(colRef, type) {
  const snap = await getDocs(query(colRef, orderBy('i','asc')));
  const b64 = snap.docs.map(d => d.data().data).join('');
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: type || 'application/octet-stream' }));
}
function saveUrl(url, name) {
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function downloadChatFile(caseId, mid) {
  const m = (await getDoc(doc(db, 'cases', caseId, 'messages', mid))).data();
  saveUrl(await assembleUrl(collection(db, 'cases', caseId, 'messages', mid, 'chunks'), m.attachment.type), m.attachment.name);
}
async function viewChatFile(caseId, mid) {
  const m = (await getDoc(doc(db, 'cases', caseId, 'messages', mid))).data();
  window.open(await assembleUrl(collection(db, 'cases', caseId, 'messages', mid, 'chunks'), m.attachment.type), '_blank');
}
async function downloadUpload(caseId, upId) {
  const u = (await getDoc(doc(db, 'cases', caseId, 'uploads', upId))).data();
  saveUrl(await assembleUrl(collection(db, 'cases', caseId, 'uploads', upId, 'chunks'), u.type), u.name);
}
async function viewUpload(caseId, upId) {
  const u = (await getDoc(doc(db, 'cases', caseId, 'uploads', upId))).data();
  window.open(await assembleUrl(collection(db, 'cases', caseId, 'uploads', upId, 'chunks'), u.type), '_blank');
}

/* ---------- materials: every asset for the case in one place ---------- */
function renderMaterials(el, caseId, canUpload) {
  el.innerHTML = `<div id="matlist"><div class="spin">Loading materials...</div></div>
    ${canUpload ? `<div style="margin-top:16px"><input type="file" id="upFile" class="hidden"><button id="upBtn">Upload a file</button> <span class="note" id="upNote"></span></div>` : ''}`;
  const list = $('matlist');
  let uploads = [], chatFiles = [];
  const paint = () => {
    const items = [
      ...uploads.map(u => ({ ...u, kind: 'upload' })),
      ...chatFiles
    ].sort((a,b) => ((b.createdAt||{}).seconds||0) - ((a.createdAt||{}).seconds||0));
    if (!items.length) { list.innerHTML = '<div class="empty">Nothing shared yet. Photos and documents from the case chats and studio uploads gather here.</div>'; return; }
    list.innerHTML = items.map(it => {
      const isImg = (it.type||'').startsWith('image/');
      const who = it.kind==='upload' ? (it.uploadedByName||'') : (it.senderName||'');
      const when = it.createdAt && it.createdAt.toDate ? it.createdAt.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      return `<div class="row"><div><div class="t">${esc(it.name)}</div>
        <div class="s"><span class="matkind">${isImg?'IMAGE':'DOC'}</span> · ${(it.size/1024).toFixed(0)} KB · ${esc(who)}${when?' · '+when:''}</div></div>
        <div class="acts">${isImg ? `<button class="ghost" data-v${it.kind}="${it.id}">View</button>` : ''}
        <button class="ghost" data-d${it.kind}="${it.id}">Download</button></div></div>`;
    }).join('');
    list.querySelectorAll('[data-vupload]').forEach(b => b.onclick = () => viewUpload(caseId, b.dataset.vupload));
    list.querySelectorAll('[data-dupload]').forEach(b => b.onclick = () => downloadUpload(caseId, b.dataset.dupload));
    list.querySelectorAll('[data-vchat]').forEach(b => b.onclick = () => viewChatFile(caseId, b.dataset.vchat));
    list.querySelectorAll('[data-dchat]').forEach(b => b.onclick = () => downloadChatFile(caseId, b.dataset.dchat));
  };
  unsub.push(onSnapshot(query(collection(db, 'cases', caseId, 'uploads'), orderBy('createdAt','desc')), snap => {
    uploads = snap.docs.map(d => ({ id: d.id, ...d.data() })); paint();
  }));
  unsub.push(onSnapshot(query(collection(db, 'cases', caseId, 'messages'), orderBy('createdAt','desc')), snap => {
    chatFiles = snap.docs.filter(d => d.data().hasAttachment)
      .map(d => ({ id: d.id, kind: 'chat', ...d.data().attachment, senderName: d.data().senderName, createdAt: d.data().createdAt }));
    paint();
  }));
  if (canUpload) {
    $('upBtn').onclick = () => $('upFile').click();
    $('upFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 8*1024*1024) { $('upNote').textContent = 'Keep files under 8 MB for now.'; return; }
      $('upNote').textContent = 'Uploading...';
      const bytes = new Uint8Array(await f.arrayBuffer());
      let bin = '';
      for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
      const b64 = btoa(bin);
      await addDoc(collection(db, 'cases', caseId, 'uploads'), {
        name: f.name, type: f.type, size: f.size,
        uploadedBy: me.uid, uploadedByName: myProfile.name, createdAt: serverTimestamp()
      }).then(async upRef => { await writeChunks(collection(db, 'cases', caseId, 'uploads', upRef.id, 'chunks'), b64); });
      $('upNote').textContent = 'Uploaded.';
      e.target.value = '';
    };
  }
}

/* ---------- live presentation viewer ---------- */
let stageCaseId = null;
function stopStageVideo() {
  const f = $('svVideoFrame'); if (f) f.src = 'about:blank';
  hide('svVideoBox'); show('svVideoBtn'); show('svAudioBtn');
}
async function claimVideoRoom(caseId) { /* admin: claims a pool room for the case, returns guest + host links */
  const caseRef = doc(db, 'cases', caseId);
  const c = (await getDoc(caseRef)).data();
  if (c && c.videoRoomUrl) {
    let host = null;
    if (c.videoPoolId) { try { const pd = (await getDoc(doc(db, 'videoPool', c.videoPoolId))).data(); host = pd && pd.hostUrl; } catch(e) {} }
    return { guest: c.videoRoomUrl, host: host || c.videoRoomUrl };
  }
  const free = await getDocs(query(collection(db, 'videoPool'), where('assigned','==',null), limitFs(1)));
  if (free.empty) return null;
  const d = free.docs[0].data();
  await updateDoc(doc(db, 'videoPool', free.docs[0].id), { assigned: caseId, assignedAt: serverTimestamp() });
  await updateDoc(caseRef, { videoRoomUrl: d.url, videoPoolId: free.docs[0].id });
  return { guest: d.url, host: d.hostUrl || d.url };
}
async function caseGuestRoom(caseId) { /* client: guest link only, set by the studio */
  const c = (await getDoc(doc(db, 'cases', caseId))).data();
  return (c && c.videoRoomUrl) || null;
}
function videoEmbedUrl(roomUrl, name, audioOnly) {
  return roomUrl + '?embed&displayName=' + encodeURIComponent(name || '') + (audioOnly ? '&video=off' : '');
}
async function joinStageMeeting(audioOnly) {
  if (!stageCaseId) return;
  const btn = audioOnly ? $('svAudioBtn') : $('svVideoBtn');
  const url = await caseGuestRoom(stageCaseId);
  if (!url) { btn.textContent = 'The studio opens the meeting room when your meeting begins'; return; }
  $('svVideoFrame').src = videoEmbedUrl(url, myProfile && myProfile.name, audioOnly);
  show('svVideoBox'); hide('svVideoBtn'); hide('svAudioBtn');
}
$('svVideoBtn').onclick = () => joinStageMeeting(false);
$('svAudioBtn').onclick = () => joinStageMeeting(true);
function watchRoom(caseId, isAdminView) {
  stageCaseId = caseId;
  unsub.push(onSnapshot(doc(db, 'rooms', caseId), async snap => {
    if (window.__activeCase && window.__activeCase !== caseId) return;
    const room = snap.exists() ? snap.data() : null;
    if (!room || !room.active || !room.presentationId) { if (!isAdminView) { stopStageVideo(); hide('stageView'); } return; }
    const pres = (await getDoc(doc(db, 'presentations', room.presentationId))).data();
    const slides = (await getDocs(query(collection(db, 'presentations', room.presentationId, 'slides'), orderBy('idx','asc')))).docs.map(d=>({id:d.id,...d.data()}));
    if (!slides.length) return;
    const i = Math.min(room.currentSlide||0, slides.length-1);
    $('svKicker').textContent = pres.title || 'Presentation';
    $('svTitle').textContent = slides[i].title || '';
    $('svBody').textContent = slides[i].body || '';
    $('svCount').textContent = `${i+1} / ${slides.length}`;
    const smb = $('svMedia'); smb.innerHTML = '';
    const sm = slides[i].media;
    if (sm && sm.mime) {
      const url = await assembleUrl(collection(db, 'presentations', room.presentationId, 'slides', slides[i].id, 'chunks'), sm.mime);
      if (sm.type === 'image') smb.innerHTML = `<img src="${url}" alt="" style="max-width:100%;border:1px solid rgba(111,99,89,.35)">`;
      else if (sm.type === 'audio') smb.innerHTML = `<audio controls src="${url}" style="width:100%"></audio>`;
      else if (sm.type === 'video') smb.innerHTML = `<video controls playsinline src="${url}" style="max-width:100%"></video>`;
    }
    if (!isAdminView) show('stageView');
  }));
}
$('leaveStage').onclick = () => { stopStageVideo(); hide('stageView'); };

      }
      await deleteDoc(p.ref);
    }

    await deleteDoc(doc(db, 'rooms', caseId)).catch(()=>{});
    await deleteDoc(doc(db, 'cases', caseId));

/* ---------- case team (multi-admin per case) ---------- */
async function renderTeam(caseId) {
  const line = $('teamLine'); if (!line) return;
  const ids = adminCase.adminIds || [];
  const profiles = await Promise.all(ids.map(async id => {
    const d = await getDoc(doc(db, 'users', id));
    return d.exists() ? { id, ...d.data() } : { id, name: 'Former admin', email: '' };
  }));
  line.innerHTML = profiles.map(p => `<span class="teamchip">${esc(p.name||p.email)}${p.id===me.uid?' (you)':''}
    ${profiles.length>1 ? `<button data-rm="${p.id}" title="Remove from case">&times;</button>` : ''}</span>`).join('');
  line.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (b.dataset.rm === me.uid) { $('teamNote').textContent = 'Ask another admin on the case to remove you.'; return; }
    adminCase.adminIds = adminCase.adminIds.filter(id => id !== b.dataset.rm);
    await updateDoc(doc(db, 'cases', caseId), { adminIds: adminCase.adminIds });
    renderTeam(caseId);
  });
  $('teamAdd').onclick = async () => {
    const email = $('teamEmail').value.trim().toLowerCase(); if (!email) return;
    $('teamNote').textContent = '';
    const hit = await getDocs(query(collection(db, 'users'), where('email','==',email)));
    if (hit.empty) { $('teamNote').textContent = 'No profile with that email yet - they sign up first, then you add them.'; return; }
    const u = { id: hit.docs[0].id, ...hit.docs[0].data() };
    if (u.role !== 'admin') { $('teamNote').textContent = 'That profile is a client, not an admin.'; return; }
    if ((adminCase.adminIds||[]).includes(u.id)) { $('teamNote').textContent = 'Already on this case.'; return; }
    adminCase.adminIds = [...(adminCase.adminIds||[]), u.id];
    await updateDoc(doc(db, 'cases', caseId), { adminIds: adminCase.adminIds });
    $('teamEmail').value = '';
    renderTeam(caseId);
  };
}

/* ---------- slides + live control (admin) ---------- */
async function renderSlidesAdmin(el, clientId, caseId) {
  el.innerHTML = '<div class="spin">Loading...</div>';
  const pres = (await getDocs(query(collection(db, 'presentations'), where('clientId','==',clientId)))).docs.map(d=>({id:d.id,...d.data()}));
  const room = (await getDoc(doc(db, 'rooms', caseId))).data() || {};
  let html = '';
  if (!pres.length) html += `<div class="empty">No presentation yet. Create one to present live in a meeting.</div>`;
  for (const p of pres) {
    const slides = (await getDocs(query(collection(db,'presentations',p.id,'slides'), orderBy('idx','asc')))).docs.map(d=>({id:d.id,...d.data()}));
    const live = room.active && room.presentationId === p.id;
    html += `<div class="slideedit">
      <div class="row" style="border:none;padding:0 0 10px"><div class="t serif" style="font-size:19px">${esc(p.title)}</div>
        <div class="acts">${live ? `<button class="solid" data-end="${p.id}">End presentation</button>` : `<button data-live="${p.id}">Present live</button>`}
          <button class="ghost" data-del="${p.id}">Delete</button></div></div>
      <div class="note hidden" id="delbox-${p.id}" style="margin:2px 0 10px">Delete this presentation and all its slides for everyone? This cannot be undone.
        <button class="ghost" data-delyes="${p.id}">Yes, delete it</button> <button class="ghost" data-delno="${p.id}">Keep it</button></div>
      ${slides.map((s,i)=>`<div class="note" style="padding:7px 0;border-top:1px solid rgba(111,99,89,.15)">${i+1}. <b>${esc(s.title||'')}</b>${s.body?' — '+esc(s.body.slice(0,90)):''}
        ${s.media ? `<div style="margin-top:4px">&#9656; ${esc(s.media.name)} <button class="ghost" data-rmmedia="${p.id}:${s.id}" style="padding:2px 8px;font-size:10px">Remove</button></div>` : ''}
        <button class="ghost" data-addmedia="${p.id}:${s.id}" style="margin-top:4px;padding:2px 8px;font-size:10px">+ Media</button></div>`).join('')}
      <input type="file" id="mediaPicker" accept="image/*,audio/*,video/*" class="hidden"><div class="note" id="mediaNote"></div>
      <div style="margin-top:12px">
        <div class="field"><label for="st-${p.id}">New slide title</label><input id="st-${p.id}" placeholder="e.g. The living room"></div>
        <div class="field"><label for="sb-${p.id}">Slide text (optional)</label><textarea id="sb-${p.id}" rows="2" placeholder="A sentence or two for this slide"></textarea></div>
        <button class="ghost" data-addslide="${p.id}">+ Add slide</button>
      </div>
      ${live ? `<div class="presentbar">
          <button data-prev="${p.id}">&larr; Prev</button>
          <span class="caps" id="livepos"></span>
          <button data-next="${p.id}">Next &rarr;</button>
        </div>
        <div style="margin-top:4px"><button class="ghost" data-video="1">Open meeting room</button>
          <div id="vbox-${p.id}" class="vbox hidden"><iframe title="Meeting room" allow="camera; microphone; autoplay; clipboard-write; display-capture; fullscreen"></iframe></div></div>` : ''}
    </div>`;
  }
  html += `<div class="slideedit">
      <div class="t serif" style="font-size:17px;margin-bottom:10px">New presentation</div>
      <div class="field"><label for="npTitle">Title</label><input id="npTitle" placeholder="e.g. The Anderson Residence - Concept One"></div>
      <button id="npGo">Create presentation</button></div>`;
  el.innerHTML = html;

  $('npGo').onclick = async () => {
    const t = $('npTitle').value.trim(); if (!t) return;
    const ref = await addDoc(collection(db,'presentations'), { clientId, title: t, createdAt: serverTimestamp() });
    await addDoc(collection(db,'presentations',ref.id,'slides'), { idx: 0, title: t, body: '' });
    renderSlidesAdmin(el, clientId, caseId);
  };
  let mediaTarget = null;
  el.querySelectorAll('[data-addmedia]').forEach(b => b.onclick = () => { mediaTarget = b.dataset.addmedia; $('mediaPicker').click(); });
  el.querySelectorAll('[data-rmmedia]').forEach(b => b.onclick = async () => {
    const [pid, sid] = b.dataset.rmmedia.split(':');
    const old = await getDocs(collection(db,'presentations',pid,'slides',sid,'chunks'));
    for (const d of old.docs) await deleteDoc(d.ref);
    await updateDoc(doc(db,'presentations',pid,'slides',sid), { media: null });
    renderSlidesAdmin(el, clientId, caseId);
  });
  $('mediaPicker').onchange = async e => {
    const f = e.target.files[0]; if (!f || !mediaTarget) return;
    const [pid, sid] = mediaTarget.split(':');
    const note = $('mediaNote');
    const kind = f.type.startsWith('image/') ? 'image' : f.type.startsWith('audio/') ? 'audio' : f.type.startsWith('video/') ? 'video' : null;
    if (!kind) { note.textContent = 'Images, audio or video only.'; return; }
    if (f.size > 8*1024*1024) { note.textContent = 'Keep files under 8 MB for now - for video, that is a short clip.'; return; }

      const old = await getDocs(collection(db,'presentations',pid,'slides',sid,'chunks'));
      for (const d of old.docs) await deleteDoc(d.ref);

      let bin = '';
      for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));

      await updateDoc(doc(db,'presentations',pid,'slides',sid), { media: { type: kind, name: f.name, mime: f.type } });
      note.textContent = '';
    } catch (err) { note.textContent = 'That did not save. Try again.'; }
    e.target.value = '';
    renderSlidesAdmin(el, clientId, caseId);
  };
  el.querySelectorAll('[data-addslide]').forEach(b => b.onclick = async () => {
    const pid = b.dataset.addslide;
    const title = $('st-'+pid).value.trim(); if (!title) { $('st-'+pid).focus(); return; }
    const body = $('sb-'+pid).value.trim();
    const slides = (await getDocs(collection(db,'presentations',pid,'slides'))).size;
    await addDoc(collection(db,'presentations',pid,'slides'), { idx: slides, title, body });
    renderSlidesAdmin(el, clientId, caseId);
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => $(`delbox-${b.dataset.del}`).classList.remove('hidden'));
  el.querySelectorAll('[data-delno]').forEach(b => b.onclick = () => $(`delbox-${b.dataset.delno}`).classList.add('hidden'));
  el.querySelectorAll('[data-delyes]').forEach(b => b.onclick = async () => {
    const pid = b.dataset.delyes;
    const slides = await getDocs(collection(db,'presentations',pid,'slides'));
    for (const d of slides.docs) await deleteDoc(d.ref);
    await deleteDoc(doc(db,'presentations',pid));
    const room = (await getDoc(doc(db,'rooms',caseId))).data();
    if (room && room.presentationId === pid)
      await setDoc(doc(db,'rooms',caseId), { active: false, presentationId: null, currentSlide: 0, updatedAt: serverTimestamp() });
    renderSlidesAdmin(el, clientId, caseId);
  });
  el.querySelectorAll('[data-live]').forEach(b => b.onclick = async () => {
    await setDoc(doc(db,'rooms',caseId), { active: true, presentationId: b.dataset.live, currentSlide: 0, updatedAt: serverTimestamp() });
    renderSlidesAdmin(el, clientId, caseId);
  });
  el.querySelectorAll('[data-end]').forEach(b => b.onclick = async () => {
    await setDoc(doc(db,'rooms',caseId), { active: false, presentationId: null, currentSlide: 0, updatedAt: serverTimestamp() });
    renderSlidesAdmin(el, clientId, caseId);
  });
  el.querySelectorAll('[data-video]').forEach(b => b.onclick = async () => {
    const box = b.parentElement.querySelector('.vbox'); const frame = box.querySelector('iframe');
    if (box.classList.contains('hidden')) {
      b.textContent = 'Opening...';
      const room = await claimVideoRoom(caseId);
      if (!room) { b.textContent = 'No meeting rooms left in the pool - tell the studio'; return; }
      frame.src = videoEmbedUrl(room.host, myProfile && myProfile.name);
      box.classList.remove('hidden'); b.textContent = 'Close meeting room';
    } else {
      frame.src = 'about:blank'; box.classList.add('hidden'); b.textContent = 'Open meeting room';
    }
  });
  el.querySelectorAll('[data-prev]').forEach(b => b.onclick = async () => {
    const r = (await getDoc(doc(db,'rooms',caseId))).data();
    await updateDoc(doc(db,'rooms',caseId), { currentSlide: Math.max(0,(r.currentSlide||0)-1), updatedAt: serverTimestamp() });
  });
  el.querySelectorAll('[data-next]').forEach(b => b.onclick = async () => {
    const r = (await getDoc(doc(db,'rooms',caseId))).data();
    await updateDoc(doc(db,'rooms',caseId), { currentSlide: (r.currentSlide||0)+1, updatedAt: serverTimestamp() });
  });
  if (room.active) {
    unsub.push(onSnapshot(doc(db,'rooms',caseId), async s => {
      const r = s.data(); if (!r.active) return;
      const slides = (await getDocs(query(collection(db,'presentations',r.presentationId,'slides'), orderBy('idx','asc')))).docs.map(d=>d.data());
      const pos = $('livepos'); if (pos) pos.textContent = `slide ${(r.currentSlide||0)+1} of ${slides.length}`;
    }));
  }
}
</script>
</body>
</html>
